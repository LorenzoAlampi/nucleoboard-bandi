name: Controllo bandi

on:
  schedule:
    - cron: "30 5 * * *"   # ogni giorno alle 05:30 UTC (06:30 o 07:30 in Italia)
  workflow_dispatch:        # permette di lanciarlo a mano dal pulsante Run workflow

permissions:
  contents: write
  issues: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla le pagine
        run: python monitor/monitor.py

      - name: Salva lo stato
        run: |
          git config user.name "bandi-bot"
          git config user.email "bandi-bot@users.noreply.github.com"
          git add monitor/state.json novita.json
          git diff --cached --quiet || git commit -m "Aggiorna controllo bandi"
          git push

      - name: Apri una segnalazione (arriva per mail)
        if: ${{ hashFiles('report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Novità bandi $(date +%F)" --body-file report.md
